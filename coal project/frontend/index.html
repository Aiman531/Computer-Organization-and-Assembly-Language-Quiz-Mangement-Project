<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assembly Quiz Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dark-theme">
    <!-- Animated Background -->
    <div class="animated-bg"></div>
    
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-lg-8 col-md-10">
                <!-- Main Card -->
                <div class="glass-card text-center p-5">
                    <div class="quiz-icon mb-4">
                        <i class="fas fa-microchip fa-4x"></i>
                    </div>
                    
                    <h1 class="display-4 fw-bold mb-3 gradient-text">
                        Assembly Language Quiz
                    </h1>
                    <h2 class="h4 text-muted mb-4">Management System</h2>
                    
                    <p class="lead mb-5">
                        Powered by Assembly Core Logic with Modern Web Interface
                    </p>
                    
                    <div class="button-group d-flex flex-wrap justify-content-center gap-3">
                        <a href="/quiz" class="btn btn-primary btn-lg px-5">
                            <i class="fas fa-play me-2"></i>Start Quiz
                        </a>
                        <a href="/records" class="btn btn-outline-info btn-lg px-4">
                            <i class="fas fa-table me-2"></i>View Records
                        </a>
                        <a href="/dashboard" class="btn btn-outline-success btn-lg px-4">
                            <i class="fas fa-chart-line me-2"></i>Dashboard
                        </a>
                    </div>
                    
                    <div class="mt-5 pt-3">
                        <small class="text-muted">
                            <i class="fas fa-database me-1"></i> Records saved in RECORD.TXT
                        </small>
                    </div>
                </div>
                
                <!-- Info Section -->
                <div class="row mt-4 g-3">
                    <div class="col-md-4">
                        <div class="info-card text-center p-3">
                            <i class="fas fa-code fa-2x mb-2 text-primary"></i>
                            <h6>Assembly Core</h6>
                            <small>Pure assembly quiz logic</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="info-card text-center p-3">
                            <i class="fas fa-chart-simple fa-2x mb-2 text-success"></i>
                            <h6>Analytics</h6>
                            <small>Interactive dashboards</small>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="info-card text-center p-3">
                            <i class="fas fa-mobile-alt fa-2x mb-2 text-warning"></i>
                            <h6>Responsive</h6>
                            <small>Mobile friendly design</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
